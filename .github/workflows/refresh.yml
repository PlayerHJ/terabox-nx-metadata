name: Refresh DLC names
on:
  schedule:
    # Check upstream once per UTC hour; avoid the busy top-of-hour minute.
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - tools/build_dlc_names.py
      - tools/build_game_metadata.py
      - tools/refresh_dlc_names.py
      - .github/workflows/refresh.yml
permissions:
  contents: write
concurrency:
  group: dlc-name-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check hourly refresh window
        id: due
        run: python tools/refresh_dlc_names.py --check-due --metadata-output data/game-metadata.json.gz
      - uses: actions/setup-python@v5
        if: steps.due.outputs.required == 'true'
        with:
          python-version: '3.12'
      - name: Prepare decoder
        if: steps.due.outputs.required == 'true'
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
      - name: Check and refresh Korean-first index
        id: build
        if: steps.due.outputs.required == 'true'
        run: python tools/refresh_dlc_names.py --metadata-output data/game-metadata.json.gz
      - name: Publish check status and changed names
        if: always() && steps.due.outputs.required == 'true'
        env:
          INDEX_BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/refresh-status.json
          if [ "$INDEX_BUILD_OUTCOME" = success ]; then
            git add -- data/dlc-names.json.gz data/game-metadata.json.gz
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Check Korean-first DLC metadata'
            git push
          fi
